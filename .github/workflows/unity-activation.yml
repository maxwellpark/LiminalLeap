# Run once by hand to get the .alf needed for a Unity Personal licence.
# Delete this workflow once UNITY_LICENSE is set.
name: Unity activation file

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activation:
    name: Request activation file
    runs-on: ubuntu-latest
    steps:
      - uses: game-ci/unity-request-activation-file@65874ef791dae6dfa5829f1cb490eafbd7b2173c # v2.2.0
        id: getManualLicenseFile
        with:
          unityVersion: 6000.2.15f1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Manual Activation File
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
